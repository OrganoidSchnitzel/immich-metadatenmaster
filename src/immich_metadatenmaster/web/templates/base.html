<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Immich Metadatenmaster{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Immich Metadatenmaster</a>
    {% if not bare %}
    <nav>
      {% if configured %}
      <a href="/dates"{% if nav.startswith('/dates') or nav.startswith('/album') %} class="active"{% endif %}>Dates</a>
      <a href="/locations"{% if nav.startswith('/locations') %} class="active"{% endif %}>Locations</a>
      <a href="/people"{% if nav.startswith('/people') %} class="active"{% endif %}>People &amp; birthdays</a>
      <a href="/history"{% if nav.startswith('/history') %} class="active"{% endif %}>History</a>
      {% endif %}
      <a href="/settings"{% if nav.startswith('/settings') %} class="active"{% endif %}>Settings</a>
      <a href="/login" id="logout"{% if not password_on %} hidden{% endif %}>Log out</a>
    </nav>
    <span id="job-pill" class="job-pill" hidden></span>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
