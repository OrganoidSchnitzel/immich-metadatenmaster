[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-metadatenmaster"
version = "0.1.0"
description = "Suggest and fix metadata in Immich: dates from faces and file names, locations from GPX tracks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pillow>=10",
    "numpy>=1.26",
    "tzdata",
    "tzfpy>=1.0",
]

[project.optional-dependencies]
# Install torch and torchvision separately first, from the same index
# (CPU: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu).
mivolo = [
    "transformers>=4.40,<5",
    "timm>=0.9",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
]
dev = ["pytest>=8"]

[project.scripts]
immich-metadatenmaster = "immich_metadatenmaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immich_metadatenmaster = ["web/templates/*.html", "web/templates/*.svg", "web/static/*", "web/static/vendor/leaflet/*",
                          "web/static/vendor/leaflet/images/*", "web/static/vendor/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
